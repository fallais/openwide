<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Open Wide!</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden; background: #FFF1D0;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; cursor: none; }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: flex-start;
    padding: max(10px, env(safe-area-inset-top)) 12px 0; pointer-events: none;
    font-size: clamp(12px, 2.1vw, 17px);
  }
  .group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; max-width: 46%; }
  .pill {
    background: rgba(255,255,255,.9); border-radius: 999px; padding: 5px 12px;
    box-shadow: 0 3px 0 rgba(90,50,120,.15); color: #5B3A78; font-weight: bold; white-space: nowrap;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  }
  .pill b { color: #E8488A; }
  #hudTimer.hot { background: #FFE0D6; color: #D9442B; }
  #hudCombo { background: #FFD84D; color: #7A4A00; transform-origin: center; transition: transform .1s; }
  #hudCond { background: #E3F4FF; color: #2F6E9E; }
  .pill.alert { background: #C8F5D8; color: #1F7A4A; animation: pulse .5s infinite alternate; }
  @keyframes pulse { to { transform: scale(1.08); } }
  .meters { display: flex; flex-direction: column; gap: 5px; min-width: 150px; }
  .meter { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.9);
    border-radius: 999px; padding: 4px 10px 4px 8px; box-shadow: 0 3px 0 rgba(90,50,120,.15);
    color: #5B3A78; font-weight: bold; font-size: .85em; }
  .meter .label { width: 5.2em; white-space: nowrap; }
  .bar { flex: 1; height: 12px; min-width: 70px; background: #EFE3F5; border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; width: 50%; border-radius: 999px; transition: width .15s, background-color .3s; }
  #messFill { background: #A0703C; }

  /* ---------- Buttons ---------- */
  .round-btn {
    position: fixed; border: none; border-radius: 50%; cursor: pointer; font-family: inherit;
    box-shadow: 0 5px 0 rgba(90,50,120,.25); touch-action: manipulation; z-index: 5;
  }
  #funnyBtn {
    right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); width: 92px; height: 92px;
    background: conic-gradient(rgba(90,50,120,.45) calc(var(--cd, 0) * 360deg), #FFD84D 0);
    font-size: 38px; line-height: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #funnyBtn small { font-size: 11px; font-weight: bold; color: #5B3A78; margin-top: 2px; }
  .round-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(90,50,120,.25); }
  #muteBtn { right: 120px; bottom: max(22px, env(safe-area-inset-bottom)); width: 48px; height: 48px; background: #fff; font-size: 22px; }
  #langBtn { right: 176px; bottom: max(22px, env(safe-area-inset-bottom)); width: 48px; height: 48px; background: #fff;
    font-size: 15px; font-weight: bold; color: #5B3A78; z-index: 20; }

  /* ---------- Overlay screens ---------- */
  .screen {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(255, 228, 240, .55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    padding: 16px; cursor: default; z-index: 10; overflow-y: auto;
  }
  .card {
    background: #fff; border-radius: 28px; padding: 24px 26px; max-width: 480px; width: 100%; margin: auto;
    text-align: center; color: #5B3A78; box-shadow: 0 10px 0 rgba(90,50,120,.18), 0 20px 50px rgba(0,0,0,.15);
    animation: pop .35s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .card h1 { font-size: clamp(36px, 9vw, 54px); color: #FF5C9E; text-shadow: 3px 3px 0 #FFD84D; letter-spacing: 1px; }
  .card h2 { font-size: 30px; color: #FF5C9E; margin-bottom: 10px; }
  .card p { margin: 8px 0; line-height: 1.4; }
  .card ul { text-align: left; margin: 12px 0 16px 18px; line-height: 1.45; font-size: 14.5px; }
  .card li { margin-bottom: 3px; }
  .stats { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; margin: 14px 0 18px; text-align: left; font-size: 17px; }
  .stats b { color: #E8488A; text-align: right; }
  .big-btn {
    background: #4CC38A; color: #fff; border: none; border-radius: 999px; padding: 14px 32px;
    font-size: 22px; font-weight: bold; font-family: inherit; cursor: pointer;
    box-shadow: 0 6px 0 #2E8F60; touch-action: manipulation;
  }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #2E8F60; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<!-- Heads-up display (updated every frame from game state). data-i18n = translated text. -->
<div id="hud" class="hidden">
  <div class="group">
    <div class="pill"><span data-i18n="level"></span> <b id="hudLevel">1</b></div>
    <div class="pill"><span data-i18n="bites"></span> <b id="hudBites">0/7</b></div>
    <div class="pill" id="hudTimer">⏱ 0:00</div>
    <div class="pill hidden" id="hudCond"></div>
  </div>
  <div class="group">
    <div class="pill"><span data-i18n="score"></span> <b id="hudScore">0</b></div>
    <div class="pill hidden" id="hudCombo"></div>
    <div class="pill" id="hudFood"></div>
    <div class="pill" id="hudBurp"></div>
  </div>
  <div class="meters">
    <div class="meter"><span class="label"><span data-i18n="mood"></span> <span id="moodFace">😊</span></span><div class="bar"><div class="fill" id="moodFill"></div></div></div>
    <div class="meter"><span class="label" data-i18n="mess"></span><div class="bar"><div class="fill" id="messFill"></div></div></div>
  </div>
</div>

<button id="funnyBtn" class="round-btn hidden" aria-label="Funny face">😜<small data-i18n="spaceKey"></small></button>
<button id="muteBtn" class="round-btn hidden" aria-label="Sound">🔊</button>
<button id="langBtn" class="round-btn" aria-label="Language">FR</button>

<div id="screenStart" class="screen">
  <div class="card">
    <h1 data-i18n="title"></h1>
    <p data-i18n="tagline"></p>
    <ul>
      <li data-i18n-html="help1"></li>
      <li data-i18n-html="help2"></li>
      <li data-i18n-html="help3"></li>
      <li data-i18n-html="help4"></li>
      <li data-i18n-html="help5"></li>
      <li data-i18n-html="help6"></li>
      <li data-i18n-html="help7"></li>
      <li data-i18n-html="help8"></li>
    </ul>
    <button class="big-btn" id="startBtn" data-i18n="start"></button>
  </div>
</div>

<div id="screenLevel" class="screen hidden">
  <div class="card">
    <h2 id="lvlTitle"></h2>
    <div class="stats">
      <span data-i18n="bites"></span><b id="lvlBites">7</b>
      <span data-i18n="misses"></span><b id="lvlMisses">0</b>
      <span data-i18n="time"></span><b id="lvlTime">0:00</b>
      <span data-i18n="speedBonus"></span><b id="lvlTimeBonus">+0</b>
      <span data-i18n="messRating"></span><b id="lvlMess"></b>
      <span data-i18n="cleanBonus"></span><b id="lvlBonus">+0</b>
      <span data-i18n="totalScore"></span><b id="lvlScore">0</b>
    </div>
    <button class="big-btn" id="nextBtn" data-i18n="nextLevel"></button>
  </div>
</div>

<div id="screenOver" class="screen hidden">
  <div class="card">
    <h2 data-i18n="gameOver"></h2>
    <p data-i18n="hadEnough"></p>
    <div class="stats">
      <span data-i18n="score"></span><b id="overScore">0</b>
      <span data-i18n="levelReached"></span><b id="overLevel">1</b>
      <span data-i18n="totalBites"></span><b id="overBites">0</b>
      <span data-i18n="messRating"></span><b id="overMess"></b>
      <span data-i18n="bestScore"></span><b id="overBest">0</b>
    </div>
    <button class="big-btn" id="againBtn" data-i18n="playAgain"></button>
  </div>
</div>

<script>
"use strict";

/* =====================================================================
   CONFIG: tweak these to tune the game.
   Distances are in "world units": the world is always 800 units tall
   and is scaled to fit the window.
   ===================================================================== */
const CONFIG = {
  world: {
    height: 800,
    minWidth: 600,          // world width follows the window aspect ratio, clamped to this range
    maxWidth: 1400,
    floorY: 640,            // y where the wall meets the floor
  },

  level: {
    bitesToWin: 7,          // successful bites needed to clear a level
    cleanBonusPerPoint: 10, // end-of-level bonus = (100 - mess) * this
    parTime: 35,            // finish faster than this (seconds) for a speed bonus
    timeBonusPerSec: 15,    // points per second under par
  },

  // Difficulty also creeps up with time spent in the current level.
  // Every `secondsPerStep` seconds adds the equivalent of one extra level, up to `maxExtra`.
  timer: { secondsPerStep: 20, maxExtra: 3, hotAfter: 30 },

  score: {
    bite: 100,              // base points per bite
    comboStep: 0.5,         // multiplier gained per consecutive clean bite
    maxMultiplier: 5,
  },

  baby: {
    headRadius: 110,
    restY: 360,             // resting head height
    rangeX: 170,            // how far the head can drift from its rest position
    rangeY: 70,
    baseSpeed: 110,         // head drift speed at level 1 (units/sec)
    speedPerLevel: 0.2,     // +20% drift speed per level
    moveIntervalMin: 0.7,   // seconds between new drift targets
    moveIntervalMax: 1.8,
    pauseChance: 0.3,       // chance a new drift target is just "hold still"
    dodgeRadius: 170,       // a loaded spoon this close to a closed mouth can trigger a dodge
    dodgeChancePerSec: 0.9,
    dodgePerLevel: 0.25,    // +25% dodge chance per level
    dodgeSpeedMult: 3.5,    // how much faster the head moves while dodging
    dodgeDuration: 0.35,
  },

  mouth: {
    closedMin: 1.2,         // seconds the mouth stays shut (random between min and max)
    closedMax: 3.0,
    openMin: 0.9,           // seconds the mouth stays open
    openMax: 1.6,
    minOpen: 0.45,          // open time never drops below this, however hard it gets
    timingPerLevel: 0.08,   // per level: closed 8% longer, open 8% shorter
    openSpeed: 6,           // animation speeds (higher = snappier)
    closeSpeed: 9,
    snapSpeed: 24,          // closing speed after a fake-out
    fakeOutChance: 0.2,     // chance an opening is a fake-out
    fakeOutPerLevel: 0.05,
    fakeOutMax: 0.55,
    fakeOutPeak: 0.45,      // how far it opens before snapping shut
    fakeOutTime: 0.35,
    biteThreshold: 0.55,    // mouth must be at least this open (0..1) to accept food
    hitRadius: 44,          // spoon must be this close to the mouth centre
  },

  mood: {
    start: 70,
    max: 100,
    biteGain: 9,
    missPenalty: 14,
    dropPenalty: 5,
    bouncePenalty: 8,
    decayPerSec: 0.7,       // babies get impatient
    lowMoodEffect: 0.6,     // at 0 mood the baby is 60% faster and trickier
  },

  mess: { splat: 8, drop: 5, bounce: 6, sneeze: 12, max: 100 },

  spoon: {
    // The spill speed depends on the food's viscosity (see FOODS below):
    runnyMaxSpeed: 1300,    // viscosity 0: watery soup spills if you move faster than this (units/sec)
    thickMaxSpeed: 2900,    // viscosity 1: thick compote stays put up to this speed
    dripBelow: 0.5,         // foods runnier than this drip while moving
    dripStartRatio: 0.35,   // drips start at this fraction of the spill speed
    dripMaxPerSec: 6,       // drip rate at the edge of spilling (for the runniest soup)
    dripMess: 0.5,          // mess added per drip
    speedSmoothing: 0.07,   // seconds; smooths out jittery mouse readings
    touchOffsetY: 70,       // on touch, the spoon sits above your finger so you can see it
    length: 140,
  },

  // Airplane trick: draw the figure shown in the baby's thought bubble with a loaded spoon.
  airplane: {
    window: 3.0,            // seconds of spoon movement kept for recognition
    sampleStep: 8,          // path is resampled every N units before analysis
    loopAngle: Math.PI * 2 * 0.9, // a figure must turn ~a full lap...
    maxLoopAngle: Math.PI * 2 * 1.3,
    closeRatio: 0.25,       // ...and end near where it started (fraction of its size)
    minSize: 70,            // ignore tiny wiggles
    cornerAngle: 0.9,       // radians of direction change that count as a corner
    curiousTime: 3.0,       // how long the baby stays curious
    openMultiplier: 2.2,    // curious baby keeps the mouth open this much longer
    cooldown: 1.0,
    hintCooldown: 2.5,      // "baby wants a triangle" reminder spacing
  },

  figures: {
    list: ['circle', 'triangle', 'square'],
    firstLevel: 'circle',   // level 1 always asks for this
    changeFromLevel: 4,     // from this level on, the figure changes during the level
    changeEvery: 12,        // seconds between changes (also changes after each successful airplane)
  },

  funnyFace: {
    cooldown: 7,
    laughTime: 1.3,
    dropResetsCooldown: true, // dropping food on the floor restarts the funny-face cooldown
  },

  // Double-tap SPACE (or the 😜 button) during a sneeze windup to pinch the nose.
  pinch: { doubleTapWindow: 0.35, points: 150, moodGain: 6, showTime: 0.6 },

  // Hold the spoon still near the baby for too long and it gets grabbed: mash to win it back.
  grab: {
    radius: 150,            // spoon this close to the mouth...
    stillSpeed: 140,        // ...moving slower than this (units/sec)...
    delay: 1.6,             // ...for this long (seconds) gets grabbed
    delayPerLevel: 0.1,     // grabs come this much sooner per level
    minDelay: 0.8,
    startPower: 0.5,        // tug-of-war: 1 = you win, 0 = baby wins
    pull: 0.35,             // how fast the baby pulls (power/sec)
    pullPerLevel: 0.05,
    mashPower: 0.09,        // power gained per click/tap/key press
    maxTime: 5,
    hairMess: 10,
  },

  // Every few bites the baby needs a burp: pat the tummy. Skip it and the next sneeze is a spit-up.
  burp: {
    bitesPerBurp: 3,
    patsNeeded: 3,
    patWindow: 1.6,         // seconds in which the pats must happen
    points: 100,
    moodGain: 8,
    moodDecayMult: 2,       // a gassy baby gets impatient twice as fast
    spitUpMess: 20,
    spitUpMood: -10,
  },

  events: {
    firstDelay: 6,          // seconds before the first random event in a level
    gapMin: 5,
    gapMax: 11,
    gapShrinkPerLevel: 0.1,
    minGap: 2.5,
    weights: { sneeze: 1, lookAway: 1.4, raspberry: 1 },
    sneezeWindup: 1.6,      // long enough to react with a double-tap
    sneezeBurst: 0.5,
    lookAwayMin: 1.4,
    lookAwayMax: 2.4,
    raspberryTime: 1.5,
  },

  // Some levels the baby is under the weather: certain events happen a lot more.
  conditions: {
    fromLevel: 2,
    chance: 0.45,           // chance a level (from fromLevel on) has a condition
    cold:     { weights: { sneeze: 4 },    gapMult: 0.6 },
    teething: { weights: { raspberry: 4 }, gapMult: 0.6 },
  },

  fx: { shakeSneeze: 18, shakeSplat: 5, maxFaceSplats: 14, maxFloorSplats: 70 },
};

// Food changes each level. viscosity: 0 = watery soup (spills and drips easily), 1 = thick compote.
const FOODS = [
  { id: 'apple',     viscosity: 0.8,  color: '#E8C15A', light: '#FFE59A' },
  { id: 'carrot',    viscosity: 0.35, color: '#FF9A3C', light: '#FFC27A' },
  { id: 'banana',    viscosity: 0.7,  color: '#F2D640', light: '#FFF08A' },
  { id: 'pea',       viscosity: 0.3,  color: '#7BC043', light: '#A8DD76' },
  { id: 'blueberry', viscosity: 0.9,  color: '#5C6BC0', light: '#98A4F0' },
  { id: 'beet',      viscosity: 0.15, color: '#C2185B', light: '#E86A9A' },
];

// Language follows the browser's preferred locales (first supported one wins, English by default).
function browserLang() {
  const prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
  for (const l of prefs) {
    const code = String(l).toLowerCase().split('-')[0];
    if (I18N[code]) return code;
  }
  return 'en';
}
let LANG = browserLang();

// Translate a key. Arrays return a random entry.
function t(key, vars) {
  let s = I18N[LANG][key] ?? I18N.en[key] ?? key;
  if (Array.isArray(s)) s = s[Math.floor(Math.random() * s.length)];
  if (vars) for (const k in vars) s = s.replace('{' + k + '}', vars[k]);
  return s;
}

/* =====================================================================
   Utilities
   ===================================================================== */
const rand  = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp  = (a, b, t) => a + (b - a) * t;
const dist  = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const TAU = Math.PI * 2;
const $ = id => document.getElementById(id);
const fmtTime = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

/* =====================================================================
   Sound: tiny synth built on the Web Audio API
   ===================================================================== */
const Sound = {
  ctx: null, master: null, noiseBuf: null, muted: false,

  // Must run from a user gesture (browsers block audio until then).
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.5;
    this.master.connect(this.ctx.destination);
    // One second of white noise, reused for splats and sneezes.
    const len = this.ctx.sampleRate;
    this.noiseBuf = this.ctx.createBuffer(1, len, len);
    const data = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  },

  tone(freq, dur, o = {}) {
    const c = this.ctx, t = c.currentTime + (o.delay || 0);
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t + dur);
    const v = o.vol ?? 0.2;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(this.master);
    osc.start(t); osc.stop(t + dur + 0.05);
  },

  noise(dur, o = {}) {
    const c = this.ctx, t = c.currentTime + (o.delay || 0);
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = this.noiseBuf;
    f.type = o.type || 'lowpass';
    f.frequency.setValueAtTime(o.filter || 1000, t);
    if (o.sweepTo) f.frequency.exponentialRampToValueAtTime(o.sweepTo, t + dur);
    f.Q.value = o.q || 1;
    const v = o.vol ?? 0.3;
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(this.master);
    src.start(t); src.stop(t + dur + 0.05);
  },

  // Buzzy lip-flapping sound: a sawtooth whose volume is wobbled by a fast LFO.
  raspberry(dur) {
    const c = this.ctx, t = c.currentTime;
    const osc = c.createOscillator(), lfo = c.createOscillator();
    const lfoGain = c.createGain(), wobble = c.createGain(), env = c.createGain(), f = c.createBiquadFilter();
    osc.type = 'sawtooth'; osc.frequency.value = 85;
    lfo.type = 'square'; lfo.frequency.value = 26;
    lfoGain.gain.value = 0.5; wobble.gain.value = 0.5;
    f.type = 'lowpass'; f.frequency.value = 900;
    env.gain.setValueAtTime(0.0001, t);
    env.gain.exponentialRampToValueAtTime(0.35, t + 0.05);
    env.gain.setValueAtTime(0.35, t + dur - 0.15);
    env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    lfo.connect(lfoGain).connect(wobble.gain);
    osc.connect(f).connect(wobble).connect(env).connect(this.master);
    osc.start(t); lfo.start(t); osc.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05);
  },

  play(name, arg = 0) {
    if (!this.ctx || this.muted) return;
    switch (name) {
      case 'nom': {
        const p = 1 + Math.min(arg, 10) * 0.06; // pitch rises with combo
        this.tone(520 * p, 0.09, { type: 'square', vol: 0.1, slide: 380 * p });
        this.tone(440 * p, 0.1, { type: 'square', vol: 0.09, slide: 300 * p, delay: 0.11 });
        this.tone(880 * p, 0.18, { type: 'triangle', vol: 0.12, delay: 0.2 });
        break;
      }
      case 'splat':
        this.noise(0.25, { vol: 0.5, filter: 1200, sweepTo: 200 });
        this.tone(170, 0.15, { vol: 0.3, slide: 60 });
        break;
      case 'plop':
        this.noise(0.1, { vol: 0.2, filter: 700 });
        this.tone(130, 0.1, { vol: 0.2, slide: 50 });
        break;
      case 'whoops': this.tone(750, 0.3, { type: 'triangle', vol: 0.15, slide: 220 }); break;
      case 'scoop':
        this.noise(0.12, { vol: 0.25, filter: 2500, type: 'bandpass' });
        this.tone(300, 0.14, { vol: 0.15, slide: 700, delay: 0.05 });
        break;
      case 'airplane':
        this.tone(220, 0.7, { type: 'sawtooth', vol: 0.06, slide: 900 });
        this.tone(226, 0.7, { type: 'sawtooth', vol: 0.05, slide: 940 });
        break;
      case 'laugh':
        for (let i = 0; i < 5; i++)
          this.tone(700 - i * 35, 0.09, { type: 'triangle', vol: 0.18, slide: 560 - i * 35, delay: i * 0.12 });
        break;
      case 'ah': this.tone(300, 1.4, { type: 'triangle', vol: 0.12, slide: 620 }); break;
      case 'choo':
        this.noise(0.45, { vol: 0.8, filter: 3500, type: 'bandpass', q: 0.7, sweepTo: 700 });
        this.tone(220, 0.2, { type: 'square', vol: 0.1, slide: 90 });
        break;
      case 'raspberry': this.raspberry(arg || 1.2); break;
      case 'cry':
        [0, 0.6, 1.2].forEach(d => this.tone(640, 0.55, { type: 'triangle', vol: 0.16, slide: 380, delay: d }));
        break;
      case 'levelup':
        [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.2, { type: 'square', vol: 0.09, delay: i * 0.1 }));
        break;
      case 'fake': this.tone(360, 0.08, { type: 'square', vol: 0.06, slide: 200 }); break;
      case 'dodge': this.noise(0.18, { vol: 0.12, filter: 1400, type: 'bandpass', sweepTo: 500 }); break;
      case 'empty': this.tone(200, 0.08, { type: 'square', vol: 0.07 }); break;
      case 'honk':
        this.tone(900, 0.12, { type: 'square', vol: 0.1, slide: 1300 });
        this.tone(1300, 0.14, { type: 'square', vol: 0.08, slide: 700, delay: 0.12 });
        break;
      case 'grab': this.tone(400, 0.15, { type: 'square', vol: 0.1, slide: 900 }); break;
      case 'mash': this.tone(500 + arg * 500, 0.05, { type: 'triangle', vol: 0.08 }); break;
      case 'pat':
        this.noise(0.06, { vol: 0.25, filter: 500 });
        this.tone(160, 0.07, { vol: 0.2, slide: 110 });
        break;
      case 'burp':
        this.tone(110, 0.55, { type: 'sawtooth', vol: 0.22, slide: 65 });
        this.noise(0.4, { vol: 0.15, filter: 400 });
        break;
      case 'newfig': this.tone(660, 0.1, { type: 'triangle', vol: 0.1, slide: 990 }); break;
      case 'click': this.tone(660, 0.06, { type: 'triangle', vol: 0.1 }); break;
    }
  },
};

/* =====================================================================
   Canvas and view scaling
   ===================================================================== */
const canvas = $('game');
const ctx = canvas.getContext('2d');
const view = { W: 1000, H: 800, scale: 1, ox: 0, oy: 0, dpr: 1, cw: 0, ch: 0 };

function resize() {
  view.dpr = Math.min(window.devicePixelRatio || 1, 2);
  view.cw = window.innerWidth;
  view.ch = window.innerHeight;
  canvas.width = Math.round(view.cw * view.dpr);
  canvas.height = Math.round(view.ch * view.dpr);
  canvas.style.width = view.cw + 'px';
  canvas.style.height = view.ch + 'px';
  view.H = CONFIG.world.height;
  view.W = clamp(view.cw / view.ch * view.H, CONFIG.world.minWidth, CONFIG.world.maxWidth);
  view.scale = Math.min(view.cw / view.W, view.ch / view.H);
  view.ox = (view.cw - view.W * view.scale) / 2;
  view.oy = (view.ch - view.H * view.scale) / 2;
  layout();
}

// Place scene elements relative to the current world width.
function layout() {
  const shift = view.W / 2 - baby.restX;
  baby.restX += shift; baby.x += shift; baby.tx += shift;
  bowl.x = 95;
  bowl.y = CONFIG.world.floorY + 70;
}

function toWorld(clientX, clientY) {
  return { x: (clientX - view.ox) / view.scale, y: (clientY - view.oy) / view.scale };
}

const figName = f => t('fig_' + f);

/* =====================================================================
   Difficulty helpers: level, time in level and mood all make the baby harder
   ===================================================================== */
// Effective difficulty: the level, plus a bit more for every second spent in it.
const lvl = () => (S.level - 1) + Math.min(CONFIG.timer.maxExtra, S.levelTime / CONFIG.timer.secondsPerStep);
// 1 at full mood, up to 1 + lowMoodEffect at zero mood
const moodStress = () => 1 + (1 - S.mood / CONFIG.mood.max) * CONFIG.mood.lowMoodEffect;

function closedDuration() {
  const c = CONFIG.mouth;
  return rand(c.closedMin, c.closedMax) * (1 + lvl() * c.timingPerLevel) * moodStress();
}
function openDuration() {
  const c = CONFIG.mouth;
  return Math.max(c.minOpen, rand(c.openMin, c.openMax) / ((1 + lvl() * c.timingPerLevel) * moodStress()));
}
function fakeOutChance() {
  const c = CONFIG.mouth;
  return Math.min(c.fakeOutMax, c.fakeOutChance + lvl() * c.fakeOutPerLevel + (moodStress() - 1) * 0.3);
}
function babySpeed() {
  const c = CONFIG.baby;
  return c.baseSpeed * (1 + lvl() * c.speedPerLevel) * moodStress();
}
function nextEventGap() {
  const e = CONFIG.events;
  const cond = S.condition ? CONFIG.conditions[S.condition].gapMult : 1;
  return Math.max(e.minGap, rand(e.gapMin, e.gapMax) / (1 + lvl() * e.gapShrinkPerLevel) * cond);
}
function grabDelay() {
  const g = CONFIG.grab;
  return Math.max(g.minDelay, g.delay - lvl() * g.delayPerLevel);
}

// Mouth centre in world coordinates (shifts sideways when the head turns).
function mouthPos() {
  return { x: baby.x + baby.turn * CONFIG.baby.headRadius * 0.45, y: baby.y + 48 };
}
// Body (tummy) placement, shared by drawing and the pat hit-test.
function bodyBox() {
  const b = baby;
  return { x: lerp(b.restX, b.x, 0.35), top: lerp(b.y + 80, b.restY + 80, 0.4) };
}
function onTummy(x, y) {
  const bb = bodyBox();
  return Math.abs(x - bb.x) < 95 && y > bb.top + 10 && y < 595 &&
         dist(x, y, baby.x, baby.y) > CONFIG.baby.headRadius;
}

  S.bites = 0; S.mess = 0; S.combo = 0; S.levelMisses = 0; S.levelTime = 0;

function resetBaby() {

function showGameOver() {

function messRating(m) {
  const r = I18N[LANG].rating;
  return m < 10 ? r[0] : m < 30 ? r[1] : m < 55 ? r[2] : m < 80 ? r[3] : r[4];
}

function showScreen(id) {
  for (const s of ['screenStart', 'screenLevel', 'screenOver']) $(s).classList.toggle('hidden', s !== id);

function addMood(v) {
  S.mood = clamp(S.mood + v, 0, CONFIG.mood.max);

function addMess(v) { S.mess = clamp(S.mess + v, 0, CONFIG.mess.max); }

// Show a hint only once per game.
function hintOnce(key, x, y, text, color, life) {

/* =====================================================================
   Player actions
   ===================================================================== */

// Click / tap release: try to put the spoon in the mouth.
function deliver() {
  if (S.screen !== 'playing' || S.grab) return;
  const b = baby, R = CONFIG.baby.headRadius, m = mouthPos();
  const onMouth = dist(spoon.x, spoon.y, m.x, m.y) < CONFIG.mouth.hitRadius;
  const onHead = dist(spoon.x, spoon.y, b.x, b.y) < R * 1.05 || onMouth;
  if (!onHead && onTummy(spoon.x, spoon.y)) return pat(spoon.x, spoon.y);

  spoon.jab = 1;
  if (!spoon.loaded) {
    Sound.play('empty');
    addText(spoon.x, spoon.y - 40, t('empty'), '#8a6aa0', 22, 0.8);
    return;
  }
  const ev = b.event && b.event.type;
  if (ev === 'raspberry' && onHead) return bounceFood();
  const canEat = b.mouth.open >= CONFIG.mouth.biteThreshold && b.chew <= 0 &&
                 Math.abs(b.turn) < 0.35 && ev !== 'sneeze';
  if (onMouth && canEat) return doBite();
  if (onHead) return doSplat(spoon.x, spoon.y);
  // Clicking thin air does nothing.
}

function doBite() {
  const b = baby;
  S.combo++;
  const mult = Math.min(CONFIG.score.maxMultiplier, 1 + (S.combo - 1) * CONFIG.score.comboStep);
  const pts = Math.round(CONFIG.score.bite * mult);
  S.score += pts;
  S.bites++; S.totalBites++;
  addMood(CONFIG.mood.biteGain + (b.curious > 0 ? 3 : 0));
  spoon.loaded = false;
  b.chew = 0.8; b.bounce = 1; b.curious = 0; b.laugh = 0;
  b.mouth.state = 'closed'; b.mouth.timer = closedDuration();
  Sound.play('nom', S.combo);
  const m = mouthPos();
  addText(m.x, m.y - 90, '+' + pts, '#FF5C9E', 38, 1);
  if (mult > 1) addText(m.x, m.y - 50, t('combo', { m: mult }), '#F2A900', 26, 1);
  for (let i = 0; i < 10; i++) {
    const a = rand(0, TAU), sp = rand(120, 260);
    particles.push({ type: i % 2 ? 'heart' : 'star', x: m.x, y: m.y - 20, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120,
      g: 300, life: 0.9, max: 0.9, size: rand(8, 14), color: i % 2 ? '#FF5C9E' : '#FFD84D', rot: 0, vr: rand(-5, 5) });
  }
  const hc = $('hudCombo'); hc.style.transform = 'scale(1.35)'; setTimeout(() => hc.style.transform = '', 120);

  if (S.bites >= CONFIG.level.bitesToWin) return startLevelEnding();

  // Burp meter fills with each bite
  if (!S.needsBurp && ++S.burpCount >= CONFIG.burp.bitesPerBurp) {
    S.needsBurp = true;
    addText(b.x, b.y - 190, t('burpNeeded'), '#1F7A4A', 30, 1.4);
    const bb = bodyBox();
    hintOnce('burp', bb.x, bb.top + 60, t('burpHint'), '#1F7A4A', 2.5);
  }
}

function doSplat(x, y) {
  const b = baby, R = CONFIG.baby.headRadius, f = food();
  S.combo = 0; S.levelMisses++;
  addMood(-CONFIG.mood.missPenalty);
  addMess(CONFIG.mess.splat);
  spoon.loaded = false;
  // Keep the splat on the face, relative to the head centre.
  let dx = x - b.x, dy = y - b.y;
  const d = Math.hypot(dx, dy), maxD = R * 0.85;
  if (d > maxD) { dx *= maxD / d; dy *= maxD / d; }
  addFaceSplat(dx, dy, rand(14, 22), f);
  b.grumpy = 1.3;
  b.vx += Math.sign(b.x - x || 1) * 250; // recoil
  S.shake = Math.max(S.shake, CONFIG.fx.shakeSplat);
  Sound.play('splat');
  addText(x, y - 50, t('splat'), '#E8488A', 30, 0.9);
  burst(x, y, 16, f);
}

function addFaceSplat(dx, dy, r, f) {
  baby.faceSplats.push(makeSplat(dx, dy, r, f));
  if (baby.faceSplats.length > CONFIG.fx.maxFaceSplats) baby.faceSplats.shift();
}

// A burst of food droplets; some land on the floor.
function burst(x, y, n, f) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(80, 340);
    particles.push({ type: i < n / 3 ? 'food' : 'dot', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 100,
      g: 900, life: 1.5, max: 1.5, size: rand(4, 8), color: Math.random() < 0.5 ? f.color : f.light,
      landY: rand(CONFIG.world.floorY + 20, view.H - 15) });
  }
}

// Spoon moved too fast: the food flies off and lands on the floor.
function dropFood() {
  const f = food();
  spoon.loaded = false;
  S.combo = 0;
  addMess(CONFIG.mess.drop);
  addMood(-CONFIG.mood.dropPenalty);
  if (CONFIG.funnyFace.dropResetsCooldown) S.funnyCd = CONFIG.funnyFace.cooldown;

  particles.push({ type: 'food', x: spoon.x, y: spoon.y, vx: spoon.svx * 0.35, vy: spoon.svy * 0.35 - 150,

}

// Raspberry: the food bounces off and flies away.
function bounceFood() {
  const f = food();
  spoon.loaded = false;
  S.combo = 0;
  addMood(-CONFIG.mood.bouncePenalty);
  addMess(CONFIG.mess.bounce);
  Sound.play('splat');
  addText(spoon.x, spoon.y - 50, t('pbbt'), '#C2185B', 32, 1);

}

function reload() {
  if (S.screen !== 'playing' || spoon.loaded || S.grab) return;
  spoon.loaded = true;
  Sound.play('scoop');
  const f = food();
  for (let i = 0; i < 6; i++)
    particles.push({ type: 'dot', x: bowl.x + rand(-20, 20), y: bowl.y - 10, vx: rand(-80, 80), vy: rand(-220, -100),
      g: 800, life: 0.6, max: 0.6, size: rand(3, 6), color: f.light });
}

// SPACE / 😜 button: a single tap pulls a funny face, a double tap during a sneeze pinches the nose.
function onFunnyTap() {
  if (S.screen !== 'playing') return;
  if (S.grab) return mashGrab();
  const b = baby, now = S.time;
  const sneezing = b.event && b.event.type === 'sneeze' && !b.event.sprayed;
  if (now - S.lastTap < CONFIG.pinch.doubleTapWindow) {
    S.lastTap = -10;
    if (sneezing) pinchNose();
    return;
  }
  S.lastTap = now;
  if (!sneezing) funnyFace();
}

function funnyFace() {
  if (S.funnyCd > 0) return;
  const b = baby;
  if (b.event) endEvent();
  b.laugh = CONFIG.funnyFace.laughTime;
  b.chew = 0;
  S.funnyCd = CONFIG.funnyFace.cooldown;
  Sound.play('laugh');
  addText(b.x, b.y - 150, t('laugh'), '#F2A900', 32, 1.1);
}

function pinchNose() {
  const b = baby, P = CONFIG.pinch;
  endEvent();
  b.pinch = P.showTime; b.bounce = 1;
  S.score += P.points;
  addMood(P.moodGain);
  Sound.play('honk');
  addText(b.x, b.y - 150, t('sneezeStopped', { p: P.points }), '#4CC38A', 32, 1.2);
}

// Pat the tummy: enough pats in a row gets the burp out.
function pat(x, y) {
  const B = CONFIG.burp;
  S.pats = S.pats.filter(tm => S.time - tm < B.patWindow);
  S.pats.push(S.time);
  baby.bounce = Math.max(baby.bounce, 0.35);
  Sound.play('pat');
  addText(x, y - 20, t('pat'), '#1F7A4A', 22, 0.5);
  if (S.needsBurp && S.pats.length >= B.patsNeeded) doBurp();
}

function doBurp() {
  const b = baby, B = CONFIG.burp;
  S.needsBurp = false; S.burpCount = 0; S.pats = [];
  S.score += B.points;
  addMood(B.moodGain);
  b.bounce = 1;
  Sound.play('burp');
  const m = mouthPos();
  addText(m.x, m.y - 200, t('burped', { p: B.points }), '#1F7A4A', 36, 1.2);
  for (let i = 0; i < 8; i++)
    particles.push({ type: 'bubble', x: m.x + rand(-20, 20), y: m.y, vx: rand(-60, 60), vy: rand(-160, -80),
      g: 0, life: 1, max: 1, size: rand(5, 11), color: '#9FE3C0' });
}

function triggerAirplane() {
  const b = baby;
  spoon.path.length = 0;
  spoon.planeCd = CONFIG.airplane.cooldown;
  if (b.curious <= 0) addText(spoon.x, spoon.y - 50, t('wheee'), '#6EC6FF', 30, 1);
  b.curious = CONFIG.airplane.curiousTime;
  Sound.play('airplane');
  // Curious baby opens up soon, and for longer.
  if (!b.event && b.mouth.state === 'closed') { b.mouth.timer = Math.min(b.mouth.timer, 0.3); b.mouth.nextLong = true; }
  if (b.mouth.state === 'fake') { b.mouth.state = 'closed'; b.mouth.timer = 0.2; b.mouth.nextLong = true; }
  for (let i = 0; i < 8; i++)
    particles.push({ type: 'star', x: b.x + rand(-80, 80), y: b.y - rand(100, 150), vx: rand(-40, 40), vy: rand(-80, -30),
      g: 0, life: 0.8, max: 0.8, size: rand(6, 10), color: '#6EC6FF', rot: 0, vr: rand(-4, 4) });
  // Harder levels switch to a new figure after each success
  if (S.level >= CONFIG.figures.changeFromLevel) changeFigure();
}

/* ---------- Spoon grab (tug-of-war) ---------- */
function startGrab() {
  S.grab = { x: spoon.x, y: spoon.y, power: CONFIG.grab.startPower, t: 0 };
  S.stillTimer = 0;
  spoon.path.length = 0;
  baby.curious = 0;
  Sound.play('grab');
  addText(spoon.x, spoon.y - 110, t('grabbed'), '#E8488A', 32, 1);
}

function mashGrab() {
  if (!S.grab) return;
  S.grab.power = Math.min(1, S.grab.power + CONFIG.grab.mashPower);
  Sound.play('mash', S.grab.power);
  if (S.grab.power >= 1) endGrab(true);
}

function updateGrab(dt) {
  const g = S.grab, C = CONFIG.grab;
  g.t += dt;
  g.power -= (C.pull + lvl() * C.pullPerLevel) * dt;
  if (g.power <= 0 || g.t > C.maxTime) endGrab(false);
}

function endGrab(won) {
  const g = S.grab, b = baby;
  S.grab = null;
  spoon.teleport = true;   // snap back to the pointer without counting it as a fast move
  if (won) {
    b.grumpy = 1;
    Sound.play('click');
    addText(g.x, g.y - 80, t('grabWin'), '#4CC38A', 30, 1);
  } else {
    // Baby wins and smears the food in their hair
    const f = food();
    spoon.loaded = false; S.combo = 0;
    addMess(CONFIG.grab.hairMess);
    addFaceSplat(rand(-40, 40), -CONFIG.baby.headRadius * 0.8, rand(18, 26), f);
    addFaceSplat(rand(-60, 60), -CONFIG.baby.headRadius * 0.65, rand(12, 18), f);
    b.laugh = 0.8;
    Sound.play('splat'); Sound.play('laugh');
    addText(b.x, b.y - 160, t('grabLose'), '#E8488A', 30, 1.3);
  }
}

/* =====================================================================
   Random baby events: sneeze, look away, raspberry
   ===================================================================== */
function pickEvent() {
  const w = { ...CONFIG.events.weights };
  if (S.condition) for (const [k, m] of Object.entries(CONFIG.conditions[S.condition].weights)) w[k] *= m;
  const total = w.sneeze + w.lookAway + w.raspberry;
  let r = Math.random() * total;
  if ((r -= w.sneeze) < 0) return 'sneeze';
  if ((r -= w.lookAway) < 0) return 'lookAway';
  return 'raspberry';
}

function startEvent(type) {
  const e = CONFIG.events, b = baby;
  b.curious = 0;
  if (type === 'sneeze') {
    b.event = { type, t: 0, dur: e.sneezeWindup + e.sneezeBurst, sprayed: false };
    Sound.play('ah');
    addText(b.x, b.y - 150, t('ah'), '#8a6aa0', 28, e.sneezeWindup);
    hintOnce('pinch', b.x, b.y - 195, t(pointer.touch ? 'pinchHintTouch' : 'pinchHintKey'), '#4CC38A', e.sneezeWindup + 0.5);
  } else if (type === 'lookAway') {
    b.event = { type, t: 0, dur: rand(e.lookAwayMin, e.lookAwayMax) };
    b.turnTarget = Math.random() < 0.5 ? -1 : 1;
  } else {
    b.event = { type, t: 0, dur: e.raspberryTime };
    Sound.play('raspberry', e.raspberryTime);
  }
}

function updateEvent(dt) {
  const e = baby.event;
  e.t += dt;
  if (e.type === 'sneeze' && !e.sprayed && e.t >= CONFIG.events.sneezeWindup) { e.sprayed = true; doSneeze(); }
  if (e.type === 'raspberry' && Math.random() < dt * 25) {
    const m = mouthPos();
    particles.push({ type: 'dot', x: m.x + rand(-15, 15), y: m.y, vx: rand(-150, 150), vy: rand(-150, 20),
      g: 600, life: 0.5, max: 0.5, size: rand(2, 4), color: '#CFEFFF' });
  }
  if (e.t >= e.dur) endEvent();
}

function endEvent() {
  baby.event = null;
  baby.turnTarget = 0;
  baby.mouth.state = 'closed';
  baby.mouth.timer = closedDuration() * 0.5;
  S.eventTimer = nextEventGap();
}

function doSneeze() {
  const m = mouthPos(), f = food(), B = CONFIG.burp;
  const spitUp = S.needsBurp;   // skipped the burp: this one's a spit-up
  S.shake = CONFIG.fx.shakeSneeze * (spitUp ? 1.4 : 1);
  Sound.play('choo');
  addText(m.x, m.y - 190, t('choo'), '#E8488A', 52, 1.1);
  addMess(spitUp ? B.spitUpMess : CONFIG.mess.sneeze);
  if (spitUp) {
    S.needsBurp = false; S.burpCount = 0;
    addMood(B.spitUpMood);
    addText(m.x, m.y - 140, t('spitUp'), '#1F7A4A', 28, 1.6);
  }
  // Spray food everywhere; it lands on the floor.
  for (let i = 0; i < (spitUp ? 55 : 28); i++) {
    const a = rand(-Math.PI * 0.95, -Math.PI * 0.05) + (Math.random() < 0.5 ? 0 : Math.PI);
    const sp = rand(250, 750);
    particles.push({ type: 'food', x: m.x, y: m.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.8,
      g: 1100, life: 3, max: 3, size: rand(4, spitUp ? 12 : 9), color: Math.random() < 0.6 ? f.color : f.light,
      landY: rand(CONFIG.world.floorY + 20, view.H - 15) });
  }
  // And a few splats right on the "camera".
  for (let i = 0; i < (spitUp ? 6 : 3); i++) {
    screenSplats.push(Object.assign(makeSplat(rand(view.W * 0.15, view.W * 0.85), rand(150, 650), rand(35, 60), f),
      { life: 3, max: 3 }));
  }
  // A loaded spoon close by gets its food knocked off.
  if (spoon.loaded && dist(spoon.x, spoon.y, m.x, m.y) < 260) dropFood();
}

/* =====================================================================
   Airplane figure recognition
   The spoon path is resampled, lightly smoothed, then we look for a
   closed loop (≈ one full turn that ends near its start) and count its
   corners: circle ≤ 1, triangle = 3, square = 4.
   ===================================================================== */
function resamplePath(pts, step) {
  const out = [{ x: pts[0].x, y: pts[0].y }];
  let px = pts[0].x, py = pts[0].y, acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const cx = pts[i].x, cy = pts[i].y;
    let d = Math.hypot(cx - px, cy - py);
    while (acc + d >= step && d > 0) {
      const k = (step - acc) / d;
      px += (cx - px) * k; py += (cy - py) * k;
      out.push({ x: px, y: py });
      d = Math.hypot(cx - px, cy - py); acc = 0;
    }
    acc += d; px = cx; py = cy;
  }
  return out;
}
function smoothPath(p) {
  return p.map((_, i) => {
    const a = p[Math.max(0, i - 1)], b = p[i], c = p[Math.min(p.length - 1, i + 1)];
    return { x: (a.x + b.x + c.x) / 3, y: (a.y + b.y + c.y) / 3 };
  });
}
function pathLength(p) {
  let L = 0;
  for (let i = 1; i < p.length; i++) L += Math.hypot(p[i].x - p[i - 1].x, p[i].y - p[i - 1].y);
  return L;
}
function wrapAngle(v) { while (v > Math.PI) v -= TAU; while (v < -Math.PI) v += TAU; return v; }
function bboxDiag(p) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const q of p) { x0 = Math.min(x0, q.x); y0 = Math.min(y0, q.y); x1 = Math.max(x1, q.x); y1 = Math.max(y1, q.y); }
  return Math.hypot(x1 - x0, y1 - y0);
}

// Walk back from the newest point until the path has turned about a full lap,
// and keep the start point closest to the current position.
function findLoop(r) {
  const A = CONFIG.airplane, end = r.length - 1;
  let sum = 0, best = -1, bestD = Infinity;
  for (let i = end - 1; i >= 1; i--) {
    let d = wrapAngle(Math.atan2(r[i + 1].y - r[i].y, r[i + 1].x - r[i].x) - Math.atan2(r[i].y - r[i - 1].y, r[i].x - r[i - 1].x));
    if (Math.abs(d) > 2.8) d = 0;   // ignore sharp reversals: zig-zags aren't loops
    sum += d;
    const a = Math.abs(sum);
    if (a > A.maxLoopAngle) break;
    if (a >= A.loopAngle) {
      const dd = dist(r[i].x, r[i].y, r[end].x, r[end].y);
      if (dd < bestD) { bestD = dd; best = i; }
    }
  }
  if (best < 0) return null;
  const loop = r.slice(best, end + 1), diag = bboxDiag(loop);
  return diag >= A.minSize && bestD <= diag * A.closeRatio ? loop : null;
}

// Corners around a closed loop: direction change measured over a 4-sample baseline (robust to jitter).
function countCorners(loop) {
  const B = 4, L = pathLength(loop);
  const q = resamplePath(loop, L / 48);
  if (q.length > 4 && dist(q[0].x, q[0].y, q[q.length - 1].x, q[q.length - 1].y) < L / 96) q.pop();
  const n = q.length, g = i => q[((i % n) + n) % n];
  const turn = [];
  for (let i = 0; i < n; i++) {
    const a = g(i - B), b = g(i), c = g(i + B);
    turn.push(Math.abs(wrapAngle(Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(b.y - a.y, b.x - a.x))));
  }
  const cand = turn.map((v, i) => [v, i]).filter(c => c[0] > CONFIG.airplane.cornerAngle).sort((a, b) => b[0] - a[0]);
  const picked = [];
  for (const [, i] of cand) if (picked.every(j => Math.min(Math.abs(j - i), n - Math.abs(j - i)) >= B + 2)) picked.push(i);
  return picked.length;
}

// 'match' if the recent path draws the figure, 'wrong' if it's a loop of another shape, null otherwise.
function matchFigure(fig, path) {
  if (path.length < 8) return null;
  const r = smoothPath(resamplePath(path, CONFIG.airplane.sampleStep));
  if (r.length < 10) return null;
  const loop = findLoop(r);
  if (!loop) return null;
  const c = countCorners(loop);
  const ok = fig === 'circle' ? c <= 1 : fig === 'triangle' ? c === 3 : c === 4;
  return ok ? 'match' : 'wrong';
}

function trackAirplane(dt) {
  const A = CONFIG.airplane, path = spoon.path;
  if (!spoon.loaded || S.grab) { path.length = 0; return; }
  const last = path[path.length - 1];
  if (!last || dist(last.x, last.y, spoon.x, spoon.y) >= 4) path.push({ x: spoon.x, y: spoon.y, t: S.time });
  while (path.length && S.time - path[0].t > A.window) path.shift();
  spoon.checkTimer -= dt;
  if (spoon.checkTimer > 0 || spoon.planeCd > 0) return;
  spoon.checkTimer = 0.05;
  const res = matchFigure(S.figure, path);
  if (res === 'match') triggerAirplane();
  else if (res === 'wrong' && spoon.hintCd <= 0) {
    spoon.hintCd = A.hintCooldown;
    const bp = bubblePos();
    addText(bp.x, bp.y - 70, t('wantsFig', { fig: figName(S.figure) }), '#6EC6FF', 24, 1.2);
  }
}

/* =====================================================================
   Updates
   ===================================================================== */
function updateBaby(dt, gameplay) {
  const b = baby;
  b.chew = Math.max(0, b.chew - dt);
  b.grumpy = Math.max(0, b.grumpy - dt);
  b.curious = Math.max(0, b.curious - dt);
  b.bounce = Math.max(0, b.bounce - dt * 2.5);
  b.pinch = Math.max(0, b.pinch - dt);
  if (b.laugh > 0) {
    b.laugh -= dt;
    if (b.laugh <= 0) { b.laugh = 0; b.mouth.state = 'closed'; b.mouth.timer = closedDuration() * 0.6; }
  }

  // Blinking
  b.blinkTimer -= dt;
  if (b.blinkTimer <= 0) { b.blink = 0.13; b.blinkTimer = rand(2, 5); }
  b.blink = Math.max(0, b.blink - dt);

  // Tears when crying
  if (b.crying) {
    b.tearTimer -= dt;
    if (b.tearTimer <= 0) {
      b.tearTimer = 0.08;
      const side = Math.random() < 0.5 ? -1 : 1;
      particles.push({ type: 'dot', x: b.x + side * 45, y: b.y - 5, vx: side * rand(60, 220), vy: rand(-250, -80),
        g: 900, life: 1, max: 1, size: rand(4, 7), color: '#7FD3FF' });
    }
  }

  // Gassy baby: little bubbles
  if (gameplay && S.needsBurp) {
    b.bubbleTimer -= dt;
    if (b.bubbleTimer <= 0) {
      b.bubbleTimer = rand(0.3, 0.7);
      const m = mouthPos();
      particles.push({ type: 'bubble', x: m.x + rand(-25, 25), y: m.y, vx: rand(-20, 20), vy: rand(-90, -50),
        g: 0, life: 1.2, max: 1.2, size: rand(4, 8), color: '#9FE3C0' });
    }
  }

  // Events (paused while the baby holds the spoon)
  if (b.event) updateEvent(dt);
  else if (gameplay && !S.grab && b.chew <= 0 && b.laugh <= 0) {
    S.eventTimer -= dt;
    if (S.eventTimer <= 0 && b.mouth.state === 'closed' && b.mouth.open < 0.2) startEvent(pickEvent());
  }

  updateHead(dt, gameplay);
  updateMouth(dt);
}

function updateHead(dt, gameplay) {
  const b = baby, C = CONFIG.baby;
  let speed = babySpeed();
  if (b.curious > 0) speed *= 0.35;
  if (b.dodge > 0) { speed *= C.dodgeSpeedMult; b.dodge -= dt; }

  // Pick a new place to drift to
  b.moveTimer -= dt;
  if (b.moveTimer <= 0) {
    if (Math.random() < C.pauseChance) { b.tx = b.x; b.ty = b.y; }
    else { b.tx = b.restX + rand(-C.rangeX, C.rangeX); b.ty = b.restY + rand(-C.rangeY, C.rangeY); }
    b.moveTimer = rand(C.moveIntervalMin, C.moveIntervalMax) / (1 + lvl() * 0.1);
  }

  // Dodge a loaded spoon that comes near a closed mouth
  if (gameplay && !S.grab && spoon.loaded && b.curious <= 0 && b.dodge <= 0 && b.laugh <= 0 && b.chew <= 0 && b.mouth.open < 0.5) {
    const m = mouthPos();
    const chance = C.dodgeChancePerSec * (1 + lvl() * C.dodgePerLevel) * moodStress();
    if (dist(spoon.x, spoon.y, m.x, m.y) < C.dodgeRadius && Math.random() < chance * dt) {
      let dir = Math.sign(m.x - spoon.x) || 1;
      if (Math.abs(b.x + dir * 120 - b.restX) > C.rangeX) dir = -dir; // cornered: go the other way
      b.tx = clamp(b.x + dir * rand(110, 180), b.restX - C.rangeX, b.restX + C.rangeX);
      b.ty = b.restY + (spoon.y < m.y ? 1 : -1) * C.rangeY * rand(0.4, 1);
      b.dodge = C.dodgeDuration;
      b.moveTimer = rand(0.5, 1);
      Sound.play('dodge');
    }
  }

  // Target with event/crying/grab adjustments
  let tx = b.tx, ty = b.ty;
  if (b.crying) { tx = b.restX; ty = b.restY; }
  if (S.grab) { tx = b.x; ty = b.y; }
  if (b.event && b.event.type === 'sneeze') ty = b.event.sprayed ? b.restY + 30 : b.restY - 40;

  // Smooth "springy" follow with a speed cap
  const dx = tx - b.x, dy = ty - b.y, d = Math.hypot(dx, dy) || 1;
  const want = Math.min(speed, d * 4);
  const k = Math.min(1, dt * 8);
  b.vx += (dx / d * want - b.vx) * k;
  b.vy += (dy / d * want - b.vy) * k;
  b.x += b.vx * dt;
  b.y += b.vy * dt;

  b.turn += (b.turnTarget - b.turn) * Math.min(1, dt * 6);
}

// Mouth: an irregular open/close rhythm, with fake-outs, plus overrides for events.
function updateMouth(dt) {
  const b = baby, m = b.mouth, C = CONFIG.mouth;
  let target;
  const ev = b.event && b.event.type;

  if (b.crying) target = 0.85;
  else if (S.grab) target = 0.2;
  else if (b.chew > 0) target = 0;
  else if (b.laugh > 0) target = 1;
  else if (ev === 'sneeze') target = b.event.sprayed ? 0.9 : 0.4; // the half-open windup is a trap!
  else if (ev === 'raspberry' || ev === 'lookAway') target = 0;
  else {
    if (b.curious > 0 && m.state === 'closed') m.timer = Math.min(m.timer, 0.4);
    m.timer -= dt;
    if (m.state === 'closed') {
      target = 0;
      if (m.timer <= 0) {
        if (b.curious <= 0 && !m.nextLong && Math.random() < fakeOutChance()) {
          m.state = 'fake'; m.timer = C.fakeOutTime;
        } else {
          const long = b.curious > 0 || m.nextLong;
          m.state = 'open'; m.timer = openDuration() * (long ? CONFIG.airplane.openMultiplier : 1);
          m.nextLong = false;
        }
      }
    } else if (m.state === 'fake') {
      target = C.fakeOutPeak;
      if (m.timer <= 0) {
        m.state = 'closed'; m.timer = closedDuration(); m.snap = true;
        if (S.screen === 'playing') Sound.play('fake');
      }
    } else { // open
      target = 1;
      if (m.timer <= 0) { m.state = 'closed'; m.timer = closedDuration(); }
    }
  }

  const sp = target > m.open ? C.openSpeed : (m.snap ? C.snapSpeed : C.closeSpeed);
  m.open += (target - m.open) * Math.min(1, sp * dt);
  if (m.open < 0.05) m.snap = false;
}

function updateSpoon(dt, gameplay) {
  // While grabbed, the spoon is stuck in the baby's fist
  if (S.grab) {
    const m = mouthPos(), pull = (1 - S.grab.power) * 0.3;
    spoon.x = lerp(S.grab.x, m.x, pull); spoon.y = lerp(S.grab.y, m.y, pull);
    spoon.svx = spoon.svy = spoon.speed = 0;
    spoon.jab = 0;
    return;
  }
  const offY = pointer.touch ? CONFIG.spoon.touchOffsetY : 0;
  const nx = pointer.x, ny = pointer.y - offY;
  if (spoon.teleport) {
    spoon.x = nx; spoon.y = ny; spoon.svx = spoon.svy = 0; spoon.teleport = false;
    spoon.trail.length = 0; spoon.path.length = 0;
  } else {
    const a = 1 - Math.exp(-dt / CONFIG.spoon.speedSmoothing);
    spoon.svx += ((nx - spoon.x) / dt - spoon.svx) * a;
    spoon.svy += ((ny - spoon.y) / dt - spoon.svy) * a;
    spoon.x = nx; spoon.y = ny;
  }
  spoon.speed = Math.hypot(spoon.svx, spoon.svy);
  spoon.jab = Math.max(0, spoon.jab - dt * 4);
  spoon.planeCd = Math.max(0, spoon.planeCd - dt);
  spoon.hintCd = Math.max(0, spoon.hintCd - dt);

  spoon.trail.push({ x: spoon.x, y: spoon.y, t: S.time });
  while (spoon.trail.length && S.time - spoon.trail[0].t > 0.35) spoon.trail.shift();

  if (!gameplay) return;
  if (spoon.loaded && spoon.speed > spillSpeed()) dropFood();
  updateDrips(dt);
  trackAirplane(dt);

  // Hovering still near the baby for too long: grabbed!
  const b = baby, m = mouthPos(), C = CONFIG.grab;
  const tempting = spoon.loaded && !b.event && !b.crying && b.laugh <= 0 && b.chew <= 0 && b.mouth.open < 0.3 &&
                   spoon.speed < C.stillSpeed && dist(spoon.x, spoon.y, m.x, m.y) < C.radius;
  S.stillTimer = tempting ? S.stillTimer + dt : 0;
  if (S.stillTimer > grabDelay()) startGrab();
}

// Runny soups drip off a moving spoon, adding a little mess.
function updateDrips(dt) {
  const C = CONFIG.spoon, f = food();
  if (!spoon.loaded || f.viscosity >= C.dripBelow) return;
  const ratio = spoon.speed / spillSpeed();
  if (ratio < C.dripStartRatio) return;
  const runniness = (C.dripBelow - f.viscosity) / C.dripBelow;
  const rate = C.dripMaxPerSec * runniness * (ratio - C.dripStartRatio) / (1 - C.dripStartRatio);
  if (Math.random() < rate * dt) {
    addMess(C.dripMess);
    particles.push({ type: 'food', x: spoon.x, y: spoon.y + 6, vx: spoon.svx * 0.2, vy: 0,
      g: 1300, life: 3, max: 3, size: rand(3, 5), color: f.color, landY: rand(CONFIG.world.floorY + 20, view.H - 15) });
  }
}

function updateParticles(dt) {
  for (const p of particles) {
    p.vy += (p.g || 0) * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.rot !== undefined) p.rot += (p.vr || 0) * dt;
    // Food lands on the floor and leaves a splat
    if (p.type === 'food' && p.vy > 0 && p.y >= p.landY) {
      p.life = 0;
      floorSplats.push(makeSplat(clamp(p.x, 10, view.W - 10), p.landY, p.big ? rand(18, 26) : rand(6, 12), { color: p.color, light: p.color }));
      if (floorSplats.length > CONFIG.fx.maxFloorSplats) floorSplats.shift();
      if (p.big && S.screen === 'playing') Sound.play('plop');
    }
  }
  particles = particles.filter(p => p.life > 0);

  for (const tx of floatTexts) { tx.life -= dt; tx.y -= 40 * dt; }
  floatTexts = floatTexts.filter(tx => tx.life > 0);

  for (const s of screenSplats) { s.life -= dt; s.y += 12 * dt; } // slowly slide down the screen
  screenSplats = screenSplats.filter(s => s.life > 0);
}

// Only touch the DOM when a value actually changes.
const hudCache = {};
function setHud(id, key, val, fn) {
  if (hudCache[id + key] === val) return;
  hudCache[id + key] = val;
  fn($(id), val);
}
function updateHUD() {
  setHud('hudLevel', 't', S.level, (e, v) => e.textContent = v);
  setHud('hudBites', 't', `${S.bites}/${CONFIG.level.bitesToWin}`, (e, v) => e.textContent = v);
  setHud('hudScore', 't', S.score, (e, v) => e.textContent = v);
  setHud('hudTimer', 't', fmtTime(S.levelTime), (e, v) => e.textContent = '⏱ ' + v);
  setHud('hudTimer', 'hot', S.levelTime > CONFIG.timer.hotAfter, (e, v) => e.classList.toggle('hot', v));
  setHud('hudCond', 't', S.condition ? t('cond_' + S.condition) : '', (e, v) => { e.textContent = v; e.classList.toggle('hidden', !v); });
  setHud('hudFood', 't', `🥣 ${foodName()} · ${t(isRunny(food()) ? 'runny' : 'thick')}`, (e, v) => e.textContent = v);
  const n = CONFIG.burp.bitesPerBurp;
  setHud('hudBurp', 't', S.needsBurp ? `💨 ${t('burpMe')}` : `💨 ${t('burp')} ${'●'.repeat(S.burpCount)}${'○'.repeat(n - S.burpCount)}`,
    (e, v) => e.textContent = v);
  setHud('hudBurp', 'alert', S.needsBurp, (e, v) => e.classList.toggle('alert', v));
  const mult = Math.min(CONFIG.score.maxMultiplier, 1 + (S.combo - 1) * CONFIG.score.comboStep);
  setHud('hudCombo', 't', S.combo > 1 ? t('combo', { m: mult }) : '', (e, v) => { e.textContent = v; e.classList.toggle('hidden', !v); });
  const mood = Math.round(S.mood);
  setHud('moodFill', 'w', mood, (e, v) => {
    e.style.width = v + '%';
    e.style.backgroundColor = v > 60 ? '#4CC38A' : v > 30 ? '#FFB23F' : '#FF5A5A';
  });
  setHud('moodFace', 't', mood > 60 ? '😊' : mood > 30 ? '😐' : mood > 0 ? '😟' : '😭', (e, v) => e.textContent = v);
  setHud('messFill', 'w', Math.round(S.mess), (e, v) => e.style.width = v + '%');
  setHud('funnyBtn', 'cd', Math.round(S.funnyCd / CONFIG.funnyFace.cooldown * 100) / 100,
    (e, v) => e.style.setProperty('--cd', v));
}

function update(dt) {
  S.time += dt;
  const gameplay = S.screen === 'playing';
  if (gameplay) {
    S.funnyCd = Math.max(0, S.funnyCd - dt);
    S.levelTime += dt;
    if (baby.chew <= 0) addMood(-CONFIG.mood.decayPerSec * (S.needsBurp ? CONFIG.burp.moodDecayMult : 1) * dt);
    if (S.grab) updateGrab(dt);
    // Harder levels: the airplane figure changes over time
    if (S.level >= CONFIG.figures.changeFromLevel && (S.figureTimer -= dt) <= 0) changeFigure();
  }
  S.figurePop = Math.max(0, S.figurePop - dt * 2);
  if (S.screen === 'crying' || S.screen === 'levelEnding') {
    S.pendingTimer -= dt;
    if (S.pendingTimer <= 0) S.screen === 'crying' ? showGameOver() : showLevelScreen();
  }
  updateBaby(dt, S.screen === 'playing');
  updateSpoon(dt, S.screen === 'playing');
  updateParticles(dt);
  S.shake *= Math.exp(-dt * 8);
  if (S.shake < 0.3) S.shake = 0;
  updateHUD();
}

/* =====================================================================
   Drawing helpers
   ===================================================================== */
function circle(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = fill; ctx.fill(); }
function ellipse(x, y, rx, ry, fill) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, TAU); ctx.fillStyle = fill; ctx.fill(); }
function rrect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function line(x1, y1, x2, y2, color, w) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.stroke();
}

// A splat is a big blob with a few random droplets around it.
function makeSplat(x, y, r, f) {
  const blobs = [];
  const n = 5 + Math.floor(Math.random() * 4);
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), d = rand(r * 0.6, r * 1.4);
    blobs.push({ dx: Math.cos(a) * d, dy: Math.sin(a) * d, r: rand(r * 0.2, r * 0.45) });
  }
  return { x, y, r, blobs, color: f.color, light: f.light };
}
function drawSplat(s, x, y, flat = 1, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.scale(1, flat);
  circle(0, 0, s.r, s.color);
  for (const b of s.blobs) circle(b.dx, b.dy, b.r, s.color);
  circle(-s.r * 0.3, -s.r * 0.3, s.r * 0.35, s.light);
  ctx.restore();
}

function drawStar(x, y, r, rot, color) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 ? r * 0.45 : r, a = i * Math.PI / 5 - Math.PI / 2;
    ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fillStyle = color; ctx.fill(); ctx.restore();
}
function drawHeart(x, y, s, color) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 10, s / 10);
  ctx.beginPath();
  ctx.moveTo(0, 4);
  ctx.bezierCurveTo(-10, -4, -6, -12, 0, -6);
  ctx.bezierCurveTo(6, -12, 10, -4, 0, 4);
  ctx.fillStyle = color; ctx.fill(); ctx.restore();
}

// Outline of an airplane figure, centred on (x, y), about 2*s wide.
function figurePath(fig, x, y, s) {
  ctx.beginPath();
  if (fig === 'circle') ctx.arc(x, y, s, 0, TAU);
  else if (fig === 'square') ctx.rect(x - s * 0.85, y - s * 0.85, s * 1.7, s * 1.7);
  else { ctx.moveTo(x, y - s); ctx.lineTo(x + s * 0.95, y + s * 0.7); ctx.lineTo(x - s * 0.95, y + s * 0.7); ctx.closePath(); }
}

function addText(x, y, text, color, size, life) {
  floatTexts.push({ x, y, text, color, size, life, max: life });
}

function drawText(text, x, y, color, size, alpha) {
  ctx.globalAlpha = alpha;
  ctx.font = `bold ${size}px "Trebuchet MS", "Segoe UI", sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = size * 0.18; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color; ctx.fillText(text, x, y);
  ctx.globalAlpha = 1;
}

/* =====================================================================
   Scene drawing
   ===================================================================== */
function drawBackground() {
  const W = view.W, H = view.H, F = CONFIG.world.floorY;
  // The world is letterboxed; paint beyond its edges so the scene fills the window.
  const L = -view.ox / view.scale - 20, R = W + view.ox / view.scale + 20;
  const T = -view.oy / view.scale - 20, B = H + view.oy / view.scale + 20;

  // Wall
  ctx.fillStyle = '#FFF1D0';
  ctx.fillRect(L, T, R - L, F - T);
  for (let x = Math.floor(L / 80) * 80; x < R; x += 80)
    for (let y = Math.floor(T / 80) * 80; y < F; y += 80)
      circle(x + ((y / 80) % 2 ? 40 : 0), y, 7, '#FFE3B0');

  // Window with sky
  const wx = W * 0.82, wy = 150;
  rrect(wx - 95, wy - 5, 190, 170, 14); ctx.fillStyle = '#fff'; ctx.fill();
  rrect(wx - 85, wy + 5, 170, 150, 8); ctx.fillStyle = '#9EDCFF'; ctx.fill();
  circle(wx + 45, wy + 45, 22, '#FFE45C');
  ellipse(wx - 30, wy + 90, 34, 14, '#fff'); ellipse(wx - 10, wy + 80, 22, 14, '#fff');
  line(wx, wy + 5, wx, wy + 155, '#fff', 8); line(wx - 85, wy + 80, wx + 85, wy + 80, '#fff', 8);

  // Bunting garland
  ctx.beginPath(); ctx.moveTo(L, 70); ctx.quadraticCurveTo(W / 2, 130, R, 70);
  ctx.strokeStyle = '#D9A6FF'; ctx.lineWidth = 3; ctx.stroke();
  const cols = ['#FF5C9E', '#FFD84D', '#4CC38A', '#6EC6FF', '#B57BFF'];
  for (let i = 0, x = L + 30; x < R; x += 70, i++) {
    const u = (x - L) / (R - L), y = 70 + 120 * u * (1 - u); // follows the garland curve
    ctx.beginPath(); ctx.moveTo(x - 16, y); ctx.lineTo(x + 16, y); ctx.lineTo(x, y + 30); ctx.closePath();
    ctx.fillStyle = cols[i % cols.length]; ctx.fill();
  }

  // Baseboard + checkered floor
  ctx.fillStyle = '#FFB7D0'; ctx.fillRect(L, F - 14, R - L, 14);
  ctx.fillStyle = '#FFF8EC'; ctx.fillRect(L, F, R - L, B - F);
  ctx.fillStyle = '#CFEFE4';
  const ts = 60;
  for (let y = F, row = 0; y < B; y += ts, row++)
    for (let x = Math.floor(L / ts) * ts; x < R; x += ts)
      if ((Math.round(x / ts) + row) % 2 === 0) ctx.fillRect(x, y, ts, ts);
}

function drawBowl() {
  const x = bowl.x, y = bowl.y, f = food();
  // Stool
  line(x - 40, y + 30, x - 50, y + 95, '#B07BD6', 9);
  line(x + 40, y + 30, x + 50, y + 95, '#B07BD6', 9);
  rrect(x - 62, y + 18, 124, 18, 9); ctx.fillStyle = '#C99AF0'; ctx.fill();
  // Bowl
  ellipse(x, y - 4, 52, 16, f.color);
  ellipse(x - 10, y - 10, 26, 8, f.light);
  ctx.beginPath(); ctx.moveTo(x - 58, y - 4); ctx.quadraticCurveTo(x, y + 60, x + 58, y - 4); ctx.closePath();
  ctx.fillStyle = '#6EC6FF'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(x, y - 4, 58, 16, 0, 0, TAU); ctx.strokeStyle = '#4AA8E8'; ctx.lineWidth = 4; ctx.stroke();
  circle(x - 22, y + 14, 5, '#fff'); circle(x, y + 20, 5, '#fff'); circle(x + 22, y + 14, 5, '#fff');

  // Pulsing hint when the spoon is empty
  if (S.screen === 'playing' && !spoon.loaded) {
    const p = (Math.sin(S.time * 6) + 1) / 2;
    ctx.beginPath(); ctx.arc(x, y, bowl.r + p * 10, 0, TAU);
    ctx.strokeStyle = `rgba(255,92,158,${0.4 + p * 0.5})`; ctx.lineWidth = 5; ctx.stroke();
    drawText(t('refill'), x, y - 70, '#FF5C9E', 24, 1);
  }
}

// Where the grabbing hand is: rests on the tray, reaches out when tempted, holds the spoon when grabbing.
function handReach(side) {
  const b = baby, bx = bodyBox().x;
  const towardSpoon = Math.sign(spoon.x - bx) || 1;
  if (side !== towardSpoon || !inGameScreen()) return 0;
  if (S.grab) return 1;
  return clamp((S.stillTimer / grabDelay() - 0.5) * 0.7, 0, 0.35); // telegraph: the hand starts reaching
}

function drawChairAndBody() {
  const b = baby, rx = b.restX, bb = bodyBox(), bx = bb.x, topY = bb.top;

  // Chair legs
  line(rx - 110, 600, rx - 160, 790, '#FF8FB8', 14);
  line(rx + 110, 600, rx + 160, 790, '#FF8FB8', 14);
  line(rx - 140, 720, rx + 140, 720, '#FF8FB8', 10);
  // Chair back
  rrect(rx - 140, 370, 280, 240, 50); ctx.fillStyle = '#FF7BAC'; ctx.fill();
  rrect(rx - 120, 390, 240, 200, 40); ctx.fillStyle = '#FF9CC2'; ctx.fill();

  // Body (onesie) with bib; wobbles when patted or gassy
  const gassy = S.needsBurp && S.screen === 'playing' ? Math.sin(S.time * 9) * 3 : 0;
  rrect(bx - 95 - gassy, topY, 190 + gassy * 2, 600 - topY, 60); ctx.fillStyle = '#6EC6FF'; ctx.fill();
  for (let i = 0; i < 5; i++) circle(bx - 60 + i * 30, topY + 110 + (i % 2) * 20, 6, '#A8DEFF');
  ctx.beginPath();
  ctx.moveTo(bx - 60, topY + 15);
  ctx.quadraticCurveTo(bx, topY + 150, bx + 60, topY + 15);
  ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill();
  // Bib gets stained as mess goes up
  const stains = Math.floor(S.mess / 15);
  for (let i = 0; i < stains; i++) circle(bx - 25 + ((i * 37) % 50), topY + 30 + ((i * 23) % 45), 6, food().color);

  // Tray
  rrect(rx - 175, 552, 350, 36, 16); ctx.fillStyle = '#FFFFFF'; ctx.fill();
  rrect(rx - 175, 578, 350, 10, 5); ctx.fillStyle = '#F1DDF5'; ctx.fill();

  // Arms and hands (they flap when laughing or crying, and reach for a lingering spoon)
  const flap = (b.laugh > 0 || b.crying) ? Math.sin(S.time * 25) * 18 : Math.sin(S.time * 2) * 3;
  for (const side of [-1, 1]) {
    const sx = bx + side * 78, sy = topY + 45;
    const reach = handReach(side);
    const hx = lerp(rx + side * 120, spoon.x, reach), hy = lerp(555 - (side === 1 ? flap : -flap), spoon.y + 10, reach);
    line(sx, sy, hx, hy, '#6EC6FF', 30);
    if (reach < 1) circle(hx, hy, 20, '#FFD2AE'); // while grabbing, the fist is drawn over the spoon
  }
}

function drawHead() {
  const b = baby, R = CONFIG.baby.headRadius;
  const ev = b.event && b.event.type;
  const tm = S.time;

  ctx.save();
  let hx = b.x, hy = b.y;
  if (b.crying) hx += Math.sin(tm * 30) * 4;
  if (b.laugh > 0) hy += Math.sin(tm * 30) * 4;
  ctx.translate(hx, hy);
  // Squash-and-stretch bounce after a bite
  const sq = Math.sin(b.bounce * Math.PI * 3) * 0.09 * b.bounce;
  ctx.scale(1 + sq, 1 - sq);
  if (ev === 'sneeze') ctx.rotate(b.event.sprayed ? 0.08 : -0.08);

  const fx = b.turn * R * 0.45;  // features shift when turning

  // Ears
  circle(-R * 0.95 - b.turn * 15, 5, 26, '#FFC79E');
  circle(R * 0.95 - b.turn * 15, 5, 26, '#FFC79E');
  // Head
  circle(0, 0, R, '#FFD9B8');
  // Hair curl
  ctx.beginPath(); ctx.arc(fx * 0.5, -R + 8, 18, Math.PI * 0.9, Math.PI * 2.3);
  ctx.strokeStyle = '#A0703C'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.stroke();

  // Cheeks (puffed while chewing, flushed when teething)
  const cheekR = b.chew > 0 ? 26 + Math.sin(tm * 25) * 3 : 20;
  ctx.globalAlpha = S.condition === 'teething' ? 0.8 : 0.55;
  circle(fx - 62, 30, cheekR, S.condition === 'teething' ? '#FF7F9A' : '#FF9FB5');
  circle(fx + 62, 30, cheekR, S.condition === 'teething' ? '#FF7F9A' : '#FF9FB5');
  ctx.globalAlpha = 1;

  // Eyes
  let eyeMode = 'open';
  if (b.crying) eyeMode = 'cry';
  else if (b.laugh > 0 || b.chew > 0) eyeMode = 'happy';
  else if (ev === 'sneeze') eyeMode = 'squint';
  else if (b.blink > 0) eyeMode = 'blink';

  // Pupils look at the spoon (or away during look-away)
  let lookX = 0, lookY = 0;
  if (ev === 'lookAway') { lookX = b.turnTarget * 7; lookY = -2; }
  else if (inGameScreen()) {
    const dx = spoon.x - hx, dy = spoon.y - hy, d = Math.hypot(dx, dy) || 1;
    const m = Math.min(7, d / 30);
    lookX = dx / d * m; lookY = dy / d * m;
  }
  const wide = b.curious > 0 || S.grab || S.stillTimer > 0.5;
  for (const side of [-1, 1]) {
    const ex = fx + side * 38, ey = -12;
    ctx.strokeStyle = '#4A2C2A'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    if (eyeMode === 'open') {
      ellipse(ex, ey, 17, 19, '#fff');
      circle(ex + lookX, ey + lookY, wide ? 12 : 10, '#3B2A4A');
      circle(ex + lookX - 3, ey + lookY - 4, 3.5, '#fff');
    } else if (eyeMode === 'blink') {
      line(ex - 13, ey, ex + 13, ey, '#4A2C2A', 5);
    } else if (eyeMode === 'happy') {
      ctx.beginPath(); ctx.arc(ex, ey + 6, 13, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    } else { // squint / cry: tightly shut > <
      ctx.beginPath();
      ctx.moveTo(ex - side * 13, ey - 9); ctx.lineTo(ex + side * 9, ey); ctx.lineTo(ex - side * 13, ey + 9);
      ctx.stroke();
    }
  }

  // Eyebrows depend on mood
  const angry = b.grumpy > 0 || S.mood < 30 || b.crying;
  const worried = !angry && S.mood < 55;
  for (const side of [-1, 1]) {
    const ex = fx + side * 38;
    const inner = angry ? -34 : worried ? -50 : -46;
    const outer = angry ? -46 : worried ? -42 : -46;
    line(ex - side * 16, outer, ex + side * 10, inner, '#A0703C', 5);
  }

  // Nose: red with a cold, squished while pinched
  const cold = S.condition === 'cold';
  const noseCol = cold ? '#FF7A7A' : '#F5B996';
  if (b.pinch > 0) {
    ellipse(fx, 16, 4, 6, noseCol);
    const squeeze = 12 + Math.sin(b.pinch * 30) * 2;
    for (const side of [-1, 1]) {
      ellipse(fx + side * squeeze, 16, 11, 14, '#F2C4A0');
      ctx.beginPath(); ctx.ellipse(fx + side * squeeze, 16, 11, 14, 0, 0, TAU);
      ctx.strokeStyle = '#D9A07E'; ctx.lineWidth = 2; ctx.stroke();
    }
  } else ellipse(fx, 16, cold ? 10 : 7, cold ? 7 : 5, noseCol);
  if (cold && b.pinch <= 0) ellipse(fx + 4, 25 + Math.sin(tm * 2) * 2, 3, 5, 'rgba(160,220,255,0.9)'); // sniffle

  // Mouth
  const my = 48, o = b.mouth.open;
  if (ev === 'raspberry') {
    const w = Math.sin(tm * 60) * 2;
    ellipse(fx, my + 12, 14, 12 + w, '#FF7C9C');   // tongue out
    ellipse(fx, my, 24 + w, 9, '#E0506F');          // vibrating lips
  } else if (b.chew > 0) {
    const w = Math.sin(tm * 25) * 4;
    ctx.beginPath(); ctx.moveTo(fx - 14, my + w * 0.3); ctx.quadraticCurveTo(fx, my + 8 - w, fx + 14, my - w * 0.3);
    ctx.strokeStyle = '#B23A57'; ctx.lineWidth = 5; ctx.stroke();
  } else if (o > 0.08) {
    const rx = 15 + 17 * o, ry = 3 + 27 * o, cy = my + ry * 0.3;
    ellipse(fx, cy, rx, ry, '#8B2635');
    ctx.save();
    ctx.beginPath(); ctx.ellipse(fx, cy, rx, ry, 0, 0, TAU); ctx.clip();
    ellipse(fx, cy + ry * 0.75, rx * 0.7, ry * 0.5, '#FF7C9C');
    if (S.condition === 'teething') { ctx.fillStyle = '#fff'; ctx.fillRect(fx - 5, cy - ry, 10, 9); } // first tooth!
    ctx.restore();
    ctx.beginPath(); ctx.ellipse(fx, cy, rx, ry, 0, 0, TAU); ctx.strokeStyle = '#D9486B'; ctx.lineWidth = 3; ctx.stroke();
  } else {
    const curve = b.grumpy > 0 ? -12 : lerp(-12, 14, S.mood / CONFIG.mood.max);
    ctx.beginPath(); ctx.moveTo(fx - 17, my); ctx.quadraticCurveTo(fx, my + curve, fx + 17, my);
    ctx.strokeStyle = '#B23A57'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke();
  }
  // Teething drool
  if (S.condition === 'teething' && ev !== 'raspberry') ellipse(fx + 20, my + 10 + (tm * 8 % 6), 3.5, 5, 'rgba(160,220,255,0.85)');

  // Food splats stuck on the face (and hair), clipped to the head
  if (b.faceSplats.length) {
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.clip();
    for (const s of b.faceSplats) drawSplat(s, s.x, s.y);
    ctx.restore();
  }
  ctx.restore();

  // "?" bubble when curious (airplane trick)
  if (b.curious > 0 && !b.crying) {
    const bob = Math.sin(tm * 6) * 5, side = bubbleSide() * -1;
    circle(b.x + side * 95, b.y - 120 + bob, 24, '#fff');
    drawText('?', b.x + side * 95, b.y - 120 + bob, '#6EC6FF', 32, 1);
  }
}

// The airplane thought bubble sits beside the head, on whichever side has room.
function bubbleSide() { return baby.x - 190 < 60 ? 1 : -1; }
function bubblePos() {
  const s = bubbleSide();
  return { x: baby.x + s * 190, y: baby.y - 150, side: s };
}
function drawFigureBubble() {
  if (S.screen !== 'playing' || baby.crying) return;
  const { x, y, side } = bubblePos();
  const pop = 1 + Math.sin(S.figurePop * Math.PI) * 0.35;
  ctx.globalAlpha = 0.95;
  circle(baby.x + side * 105, baby.y - 95, 8, '#fff');
  circle(baby.x + side * 135, baby.y - 115, 12, '#fff');
  ellipse(x, y, 50 * pop, 44 * pop, '#fff');
  ctx.globalAlpha = 1;
  figurePath(S.figure, x, y + 2, 22 * pop);
  ctx.strokeStyle = '#6EC6FF'; ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.stroke();
  drawText('✈', x - 34 * pop, y - 28 * pop, '#FF5C9E', 20, 1);
  // With figure changes on, show how long until the next one
  if (S.level >= CONFIG.figures.changeFromLevel) {
    ctx.beginPath(); ctx.arc(x, y, 50 * pop + 5, -Math.PI / 2, -Math.PI / 2 + TAU * S.figureTimer / CONFIG.figures.changeEvery);
    ctx.strokeStyle = 'rgba(110,198,255,0.6)'; ctx.lineWidth = 4; ctx.stroke();
  }
}

function drawSpoon() {
  if (!inGameScreen()) return;
  const f = food();
  const speedRatio = clamp(spoon.speed / spillSpeed(), 0, 1);

  // Motion trail (helps with drawing airplane figures)
  if (spoon.loaded && !S.grab && spoon.trail.length > 2) {
    ctx.beginPath();
    spoon.trail.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.strokeStyle = 'rgba(110,198,255,0.35)'; ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
  }

  ctx.save();
  ctx.translate(spoon.x, spoon.y);
  const s = 1 - Math.sin(spoon.jab * Math.PI) * 0.18; // quick "push" when delivering
  ctx.scale(s, s);
  const tilt = S.grab ? Math.sin(S.time * 30) * 0.15 : clamp(spoon.svx / 3000, -0.3, 0.3);
  ctx.rotate(0.8 + tilt);
  // Handle points down-right from the spoon bowl at the origin
  rrect(14, -7, CONFIG.spoon.length, 14, 7); ctx.fillStyle = '#FF5C9E'; ctx.fill();
  rrect(14, -3, 40, 6, 3); ctx.fillStyle = '#D9D9E6'; ctx.fill();
  ellipse(0, 0, 28, 18, '#E6E6F0');
  ellipse(-3, -3, 20, 12, '#C8C8D8');
  if (spoon.loaded) {
    // Food wobbles more the faster you go (and more for runny food)
    const w = Math.sin(S.time * 45) * speedRatio * speedRatio * 6 * (1.6 - f.viscosity);
    if (isRunny(f)) {        // soup: a flat, glossy pool that sloshes
      ellipse(-3 + w, -3, 22, 13, f.color);
      ellipse(-9 + w * 1.5, -7, 9, 3, 'rgba(255,255,255,0.6)');
    } else {                 // compote: a domed blob
      ellipse(-2 + w, -8, 20, 12, f.color);
      ellipse(-7 + w, -12, 8, 5, f.light);
    }
  }
  ctx.restore();

  // Warning shake lines when close to spilling
  if (spoon.loaded && speedRatio > 0.65) {
    ctx.globalAlpha = (speedRatio - 0.65) / 0.35;
    line(spoon.x - 34, spoon.y - 28, spoon.x - 26, spoon.y - 36, '#FF5A5A', 4);
    line(spoon.x + 30, spoon.y - 30, spoon.x + 38, spoon.y - 38, '#FF5A5A', 4);
    ctx.globalAlpha = 1;
  }

  // Tug-of-war: baby's fist on the handle and the power bar
  if (S.grab) {
    const hx = spoon.x + Math.cos(0.8) * 45, hy = spoon.y + Math.sin(0.8) * 45;
    circle(hx, hy, 21, '#FFD2AE');
    const w = 170, x = spoon.x - w / 2, y = spoon.y - 95, p = S.grab.power;
    rrect(x - 4, y - 4, w + 8, 26, 13); ctx.fillStyle = '#fff'; ctx.fill();
    rrect(x, y, w, 18, 9); ctx.fillStyle = '#FFD6E6'; ctx.fill();
    rrect(x, y, Math.max(18, w * p), 18, 9); ctx.fillStyle = p > 0.5 ? '#4CC38A' : '#FF8A3C'; ctx.fill();
    drawText(t(pointer.touch ? 'mashTouch' : 'mashKey'), spoon.x, y - 22, '#E8488A', 24, 0.6 + Math.sin(S.time * 20) * 0.4);
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = clamp(p.life / p.max * 2, 0, 1);
    ctx.globalAlpha = p.type === 'food' ? 1 : a;
    if (p.type === 'star') drawStar(p.x, p.y, p.size, p.rot, p.color);
    else if (p.type === 'heart') drawHeart(p.x, p.y, p.size, p.color);
    else if (p.type === 'bubble') {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU);
      ctx.strokeStyle = p.color; ctx.lineWidth = 2.5; ctx.stroke();
    } else if (p.type === 'confetti') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore();
    } else circle(p.x, p.y, p.size, p.color);
  }
  ctx.globalAlpha = 1;
}

function draw() {
  const { dpr, scale, ox, oy } = view;
  const sx = (Math.random() - 0.5) * S.shake * 2 * scale;
  const sy = (Math.random() - 0.5) * S.shake * 2 * scale;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (ox + sx), dpr * (oy + sy));

  drawBackground();
  for (const s of floorSplats) drawSplat(s, s.x, s.y, 0.45);
  drawBowl();
  drawChairAndBody();
  drawHead();
  drawFigureBubble();
  drawParticles();
  drawSpoon();
  for (const tx of floatTexts) {
    const pop = 1 + Math.max(0, (tx.life - tx.max + 0.15) / 0.15) * 0.4; // pops in big, then settles
    drawText(tx.text, tx.x, tx.y, tx.color, tx.size * pop, clamp(tx.life / tx.max * 2.5, 0, 1));
  }
  for (const s of screenSplats) drawSplat(s, s.x, s.y, 1, clamp(s.life / s.max * 2, 0, 0.9));
}

/* =====================================================================
   Language
   ===================================================================== */
function applyLang() {
  document.documentElement.lang = LANG;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  $('langBtn').textContent = LANG === 'fr' ? 'EN' : 'FR';   // shows the language you'd switch to
  for (const k in hudCache) delete hudCache[k];
  if (S.screen === 'levelDone') fillLevelScreen();
  if (S.screen === 'over') fillGameOver();
}
// Manual switch for this visit only; a reload goes back to the browser's locale.
function toggleLang() {
  LANG = LANG === 'fr' ? 'en' : 'fr';
  applyLang();
}

/* =====================================================================
   Input
   ===================================================================== */
function setPointer(e) {
  const p = toWorld(e.clientX, e.clientY);
  pointer.x = p.x; pointer.y = p.y;
}
const onBowl = () => dist(pointer.x, pointer.y, bowl.x, bowl.y) < bowl.r;

canvas.addEventListener('pointerdown', e => {
  Sound.init();
  pointer.touch = e.pointerType !== 'mouse';
  pointer.down = true;
  setPointer(e);
  Object.assign(press, { x: pointer.x, y: pointer.y, t: performance.now(), mash: false });
  if (pointer.touch) spoon.teleport = true; // finger jumped here: don't count it as speed
  if (S.grab) { press.mash = true; mashGrab(); return; }
  if (onBowl()) { reload(); return; }
  if (!pointer.touch) deliver(); // mouse: click delivers; touch: lifting the finger delivers
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' && !pointer.down) return;
  pointer.touch = e.pointerType !== 'mouse';
  setPointer(e);
});
canvas.addEventListener('pointerup', e => {
  if (!pointer.down) return;
  pointer.down = false;
  if (e.pointerType === 'mouse' || press.mash || S.grab) return;
  // A quick tap on the tummy is a pat; otherwise lifting the finger feeds.
  const tap = performance.now() - press.t < 300 && dist(pointer.x, pointer.y, press.x, press.y) < 20;
  if (tap && S.screen === 'playing' && onTummy(pointer.x, pointer.y)) return pat(pointer.x, pointer.y);
  if (!onBowl()) deliver();
});
canvas.addEventListener('pointercancel', () => { pointer.down = false; });
canvas.addEventListener('pointerenter', e => { setPointer(e); spoon.teleport = true; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  if (e.code === 'Space') e.preventDefault();
  if (e.repeat) return;
  if (S.grab) { mashGrab(); return; }   // any key helps win the tug-of-war
  if (e.code === 'Space') { Sound.init(); onFunnyTap(); }
  if (e.code === 'KeyM') toggleMute();
  if (e.code === 'Enter') {
    const btn = { start: 'startBtn', levelDone: 'nextBtn', over: 'againBtn' }[S.screen];
    if (btn) $(btn).click();
  }
});

function toggleMute() {
  Sound.muted = !Sound.muted;
  $('muteBtn').textContent = Sound.muted ? '🔇' : '🔊';
}

$('funnyBtn').addEventListener('click', () => { Sound.init(); onFunnyTap(); });
$('muteBtn').addEventListener('click', toggleMute);
$('langBtn').addEventListener('click', toggleLang);
$('startBtn').addEventListener('click', () => { Sound.init(); Sound.play('click'); startGame(); });
$('nextBtn').addEventListener('click', () => { Sound.play('click'); S.level++; startLevel(); });
$('againBtn').addEventListener('click', () => { Sound.play('click'); startGame(); });

window.addEventListener('resize', resize);

/* =====================================================================
   Main loop
   ===================================================================== */
applyLang();
resize();
pointer.x = view.W * 0.72; pointer.y = view.H * 0.72;
let lastTime = performance.now();
function frame(now) {
  const dt = clamp((now - lastTime) / 1000, 0.001, 0.05); // cap dt so a background tab doesn't explode physics
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
